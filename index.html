<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- iPad/iOS: occupa tutto il viewport (notch/home indicator),
         disabilita pinch-zoom del browser (gestito da Phaser internamente). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>hex-tactics</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        color: #ddd;
        font-family: -apple-system, system-ui, sans-serif;
        /* iOS: disabilita gesture predefinite del browser sul canvas;
           lo scroll del menu è gestito internamente da Phaser (camera scroll). */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* Niente flex centering: il canvas Phaser deve essere posizionato a (0,0)
         relativamente al container per evitare mismatch tra coord viewport e coord pointer
         interne (bug visibile come "click non allineato al cursore"). */
      #game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }
      canvas { display: block; touch-action: none; position: absolute; top: 0; left: 0; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
